name: T11 independent bank connectivity

# Dispatch only after confirming existing no-charge runner capacity. There is
# deliberately no push, PR, schedule, or automatic retry trigger.
on:
  workflow_dispatch:
    inputs:
      probe_session:
        description: 'Create ONE PUB-01 session after TLS. Reconcile prior probe logs before any rerun; no retry is authorized.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: t11-independent-bank-connectivity
  cancel-in-progress: false

jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bounded unauthenticated verified TLS
        timeout-minutes: 1
        env:
          T11_CA_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          set -o pipefail
          sh tools/t11-connectivity.sh 2>&1 | tee "$RUNNER_TEMP/t11-tls.txt"
      - name: Python 3.11 for explicit retrieval
        if: ${{ inputs.probe_session }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          check-latest: false
      - name: Explicit one-session HostedBackend retrieval
        if: ${{ inputs.probe_session }}
        timeout-minutes: 1
        run: |
          python tools/t11_bank_probe.py --execute \
            --verified-tls-log "$RUNNER_TEMP/t11-tls.txt" \
            --state "$RUNNER_TEMP/t11-session-attempt.json"
      - name: Retain sanitized attempted-write evidence in job logs
        if: ${{ always() && inputs.probe_session }}
        run: |
          if test -f "$RUNNER_TEMP/t11-session-attempt.json"; then
            cat "$RUNNER_TEMP/t11-session-attempt.json"
          else
            echo '{"attempt_state_absent":true,"creation_persistence":"unproven; inspect preceding step logs before any rerun"}'
          fi
